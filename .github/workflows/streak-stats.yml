name: Generate Streak Stats

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        env:
          GITHUB_USERNAME: ShaneLiu04
          OUTPUT_PATH: assets/streak-stats.svg
          STREAK_TIMEZONE: Asia/Shanghai
          STREAK_START_YEAR: "2023"
        run: python3 .github/scripts/generate-streak-stats.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats.svg
          git diff --cached --quiet || git commit -m "chore: update streak stats [skip ci]"
          git push
